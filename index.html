<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Commons – chat</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app">
    <header class="topbar">
      <div class="brand">
        <h1>Commons</h1>
        <p>Room: general</p>
      </div>
      <div class="actions">
        <span class="status" id="status" role="status" data-state="connecting">
          <span class="dot" aria-hidden="true"></span>
          <span id="status-text">Connecting</span>
        </span>
        <button type="button" class="btn-ghost" id="rename-btn">Change name</button>
      </div>
    </header>

    <section class="messages" id="messages" role="log" aria-live="polite" aria-label="Messages">
      <p class="empty" id="empty">No messages yet. Say hello to anyone who has this link.</p>
    </section>

    <form class="composer" id="composer" autocomplete="off">
      <label for="text" class="sr-only">Message</label>
      <input type="text" id="text" placeholder="Write a message" maxlength="500" required>
      <button type="submit" class="btn-send">Send</button>
    </form>
  </main>

  <dialog id="name-dialog">
    <form id="name-form">
      <h2>What should we call you?</h2>
      <label for="name-input" class="sr-only">Your name</label>
      <input type="text" id="name-input" placeholder="Your name" maxlength="24" required>
      <button type="submit" class="btn-send">Save name</button>
    </form>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
